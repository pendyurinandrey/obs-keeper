[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-keeper"
version = "0.1.0"
description = "Watchdog for OBS Studio: alerts you (and can auto-heal) when recorded audio goes silent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "obsws-python>=1.8",
    "keyring>=25",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest", "websockets>=13", "PySide6>=6.7"]

[project.scripts]
obs-keeper = "obs_keeper.cli:main"

[tool.setuptools.packages.find]
include = ["obs_keeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
